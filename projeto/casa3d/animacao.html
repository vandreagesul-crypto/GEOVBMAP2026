  const L=w[3]-w[2], dir=w[0];
  const geo=new THREE.BoxGeometry(dir==='x'?L:0.25,0.26,dir==='x'?0.25:L);
  geo.translate(dir==='x'?L/2:0,0,dir==='x'?0:L/2);
  const m=new THREE.Mesh(geo,mBeam); m.castShadow=m.receiveShadow=true;
  m.position.set(dir==='x'?w[2]:w[1]+T/2,-0.14,dir==='x'?w[1]+T/2:w[2]); m.userData={dir,key:dir==='x'?w[2]:w[1]}; scene.add(m); return m;
}).sort((a,b)=>a.userData.key-b.userData.key);

// planos de avanço: contrapiso e laje "concretados" da frente para o fundo; platibanda sobe
const pour=new THREE.Plane(new THREE.Vector3(-1,0,0),0), pourS=new THREE.Plane(new THREE.Vector3(-1,0,0),0), platC=new THREE.Plane(new THREE.Vector3(0,-1,0),0);
mLot.clippingPlanes=[clip,pour]; rooms.forEach(r=>{ r.mat.clippingPlanes=[clip,pour]; });
mSlab.clippingPlanes=[pourS]; mPlat.clippingPlanes=[platC]; mSlab.clipShadows=mPlat.clipShadows=true;

// transformação: alvenaria aparente -> reboco e pintura
const RAW=new THREE.Color(0xb46a48), CONC=new THREE.Color(0xa9aaa6);
const paint=[mWall,mMuro.N,mMuro.S,mMuro.E,mMuro.W].map(m=>({m,a:RAW,b:m.color.clone()}))
  .concat([{m:mPlat,a:RAW,b:mPlat.color.clone()},{m:mSlab,a:CONC,b:mSlab.color.clone()}]);

const v=(x,y,z)=>new THREE.Vector3(x,y,z);
const KEYS=[[0,v(11,66,6),v(16.3,0,6)],[3,v(4,60,8),v(16.3,0,6)],[6,v(-14,38,16),v(15,0,6)],[8.5,v(-18,30,14),v(14,.5,6)],
 [14,v(-16,27,-6),v(14,1.5,6)],[17,v(-14,32,4),v(14,3,6)],[19.5,v(-4,34,-6),v(15,3,5.5)],[21.5,v(5,24,-13),v(17,1,5)],
 [23.2,v(-24,15,5),v(5,2.5,6)],[25,v(-32,8,18),v(2,2.6,6)],[27,v(-33,10,20),v(4,2.6,6)],[30,v(-28,32,27),v(13,2,6)]];
// afasta a câmera para caber no quadro vertical (campo horizontal estreito)
[1.9,1.9,1.7,1.7,1.7,1.7,1.7,1.5,1.5,1.4,1.4,1.8].forEach((f,i)=>{ const k=KEYS[i]; k[1].sub(k[2]).multiplyScalar(f).add(k[2]); });
const cP=new THREE.CatmullRomCurve3(KEYS.map(k=>k[1]),false,'centripetal'), cT=new THREE.CatmullRomCurve3(KEYS.map(k=>k[2]),false,'centripetal');
const ST=[[0,'Terreno e locação','12,00 × 32,60 m · 391,20 m²'],[3,'Fundação','Vigas baldrame · esquemático'],[6,'Contrapiso','Nível 0,00 · 391,20 m²'],
 [8.5,'Alvenaria','Paredes 15 cm · pé-direito 4,00 m'],[14,'Laje e platibanda','Laje +4,15 m · topo +5,62 m'],[17,'Cobertura','Telha fibrocimento · i = 10 %'],
 [19.5,'Esquadrias','19 janelas PVC · 15 portas'],[22.5,'Reboco e pintura','Cinza elefante · faixa preta'],[26,'Residência unifamiliar','261,81 m² construídos · 4 suítes']];
$('#segs').innerHTML=ST.map(()=>'<i><b></b></i>').join('');
const segB=[...document.querySelectorAll('.segs b')];
const cl=x=>Math.max(0,Math.min(1,x)), ramp=(t,a,b)=>cl((t-a)/(b-a)), ss=x=>x*x*(3-2*x), eo=x=>1-Math.pow(1-x,3);
const tmp=new THREE.Vector3(); let lastStage=-1;

window.DUR=DUR; window.FPS=FPS;
window.setTime=function(t){
  // câmera
  let i=0; while(i<KEYS.length-2&&t>=KEYS[i+1][0]) i++;
  const u=(i+ramp(t,KEYS[i][0],KEYS[i+1][0]))/(KEYS.length-1);
  camera.position.copy(cP.getPoint(u)); camera.lookAt(cT.getPoint(u)); camera.updateMatrixWorld();
  // fundação
  beams.forEach((m,k)=>{ const s=eo(ramp(t,3.2+k/beams.length*2.0,3.9+k/beams.length*2.0)); m.visible=s>0; const sc=Math.max(s,.001); if(m.userData.dir==='x') m.scale.set(sc,1,1); else m.scale.set(1,1,sc); });
  // contrapiso
  pour.constant=-0.5+ss(ramp(t,6.2,8.2))*33.5;
  // alvenaria
  const cut=t<8.7?0.06:(t<13.7?0.06+ramp(t,8.7,13.6)*4.1:9); clip.constant=cut;
  const showCaps=t<3||(t>=8.7&&cut<4.16);
  pieces.forEach(p=>{ p.cap.visible=showCaps&&cut>p.y0+.001&&cut<p.y1-.001; p.cap.position.y=cut; });
  // laje, platibanda, telha
  roofG.visible=t>=14.1; pourS.constant=-0.5+ss(ramp(t,14.1,15.6))*29.5; platC.constant=4.14+ss(ramp(t,15.5,16.9))*1.6;
  tileG.visible=t>=17.2; tileG.position.y=(1-eo(ramp(t,17.2,19.0)))*7;
  // esquadrias
  const op=ss(ramp(t,19.8,21.3)); openG.visible=op>0.01; openMats.forEach(o=>{ o.m.opacity=o.base*op; });
  // pintura
  const pk=ss(ramp(t,22.8,25.4)); paint.forEach(p=>p.m.color.copy(p.a).lerp(p.b,pk));
  // cotas
  dimG.visible=t<3;
  dims.forEach(d=>{ tmp.copy(d.p).project(camera); const on=t>0.5&&t<2.9; d.el.classList.toggle('on',on);
    d.el.style.transform='translate(-50%,-50%) translate('+((tmp.x*.5+.5)*1080).toFixed(1)+'px,'+((-tmp.y*.5+.5)*1920).toFixed(1)+'px)'; });
  // legendas
  let s=0; while(s<ST.length-1&&t>=ST[s+1][0]) s++;
  if(s!==lastStage){ lastStage=s; $('#k').textContent=String(s+1).padStart(2,'0')+' / '+String(ST.length).padStart(2,'0'); $('#h').textContent=ST[s][1]; $('#d').textContent=ST[s][2]; }
  const end=s<ST.length-1?ST[s+1][0]:DUR, a=eo(ramp(t,ST[s][0],ST[s][0]+.4))*(s<ST.length-1?1-ramp(t,end-.2,end):1);
  const cap=$('#cap'); cap.style.opacity=a.toFixed(3); cap.style.transform='translateY('+((1-eo(ramp(t,ST[s][0],ST[s][0]+.4)))*24).toFixed(1)+'px)';
  segB.forEach((b,k)=>{ const e=k<ST.length-1?ST[k+1][0]:DUR; b.style.transform='scaleX('+ramp(t,ST[k][0],e).toFixed(4)+')'; });
  renderer.render(scene,camera);
};
// pré-visualização no navegador: reproduz em tempo real; ?t=12 congela num instante
const q=new URLSearchParams(location.search);
if(q.has('t')) setTime(parseFloat(q.get('t')));
else if(!q.has('render')){ const t0=performance.now(); (function loop(){ setTime(((performance.now()-t0)/1000)%DUR); requestAnimationFrame(loop); })(); }
window.READY=true;
})();
</script></body></html>
